services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  keycloak-init:
    image: node:lts-alpine
    depends_on:
      - keycloak
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: event-system
      KEYCLOAK_CLIENT_ID: nest-api
      KEYCLOAK_SA_CLIENT_ID: nest-api-sa
      KEYCLOAK_SA_CLIENT_SECRET: nest-api-sa-secret
    volumes:
      - ./scripts/keycloak-setup.sh:/scripts/keycloak-setup.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - apk add --no-cache bash curl && bash /scripts/keycloak-setup.sh

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"

  dynamodb-init:
    image: amazon/aws-cli:latest
    depends_on:
      - dynamodb-local
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./scripts/dynamodb-init.sh:/scripts/dynamodb-init.sh:ro
    entrypoint: ["/bin/sh", "/scripts/dynamodb-init.sh"]

  app:
    build:
      context: .
      target: runner
    depends_on:
      keycloak-init:
        condition: service_completed_successfully
      dynamodb-init:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URL: http://localhost:8080
      KEYCLOAK_REALM: event-system
      KEYCLOAK_CLIENT_ID: nest-api
      KEYCLOAK_SA_CLIENT_ID: nest-api-sa
      KEYCLOAK_SA_CLIENT_SECRET: nest-api-sa-secret
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      DYNAMODB_TABLE_NAME: event-system
    ports:
      - "3000:3000"

volumes:
  keycloak_data:
